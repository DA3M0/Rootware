[package]
name = "{{project_name}}"
version = "0.1.0"
edition = "2024"

[dependencies]
# 模板按 user/<name>/ 的目录深度实例化;放在别处时请相应调整。
librootware = { path = "../../sdk/librootware", default-features = false, features = ["crt0"] }

[features]
# 默认按 Rootware 裸机构建(./build.sh driver {{project_name}});
# 主机模拟开发时加 --features host-sim(有 std,可 cargo test)。
host-sim = ["librootware/std"]

# Standalone workspace: user programs build against the SDK by path,
# outside the kernel workspace.
[workspace]
